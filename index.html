    <style>
        /* Custom font set to Geist */
        body {
            font-family: "Geist Sans", sans-serif;
            background-color: #f8f8f8;
        }

        .species-option .latin {
            font-style: italic;
        }

        /* Keyframes for the bounce animation */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        /* Apply the bounce animation to the arrow */
        .bouncing-arrow {
            animation: bounce 2s infinite;
        }
    </style>

        // Safe CSV parser handling quotes smoothly
        function parseLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"' || char === '“' || char === '”') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        function parseAddressCSV(csv) {
            const lines = csv.trim().split('\n');
            const addressMap = {};
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                const parts = parseLine(lines[i]);
                if (parts.length >= 2) {
                    const location = parts[0];
                    const address = parts[1];
                    const storyMapLink = parts[2] || '';
                    addressMap[location] = { address: address, storyMapLink: storyMapLink };
                }
            }
            return addressMap;
        }

        const libraryAddresses = parseAddressCSV(addressCSV);

        function parseSpeciesLibraryCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = parseLine(lines[0]);
            const locationNames = headers.slice(3);
            const parsedData = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                const parts = parseLine(lines[i]);
                if (parts.length < 3) continue;

                const commonName = parts[0];
                const spanishName = parts[1];
                const latinName = parts[2];

                for (let j = 0; j < locationNames.length; j++) {
                    const cellValue = parts[j + 3] || '';
                    const currentLocationName = locationNames[j];
                    
                    if (cellValue === 'Yes' || cellValue === 'X') {
                        const locationInfo = libraryAddresses[currentLocationName];
                        parsedData.push({
                            commonName: commonName,
                            spanishName: spanishName,
                            latinName: latinName,
                            location: currentLocationName,
                            address: locationInfo ? locationInfo.address : 'Address not found',
                            storyMapLink: locationInfo ? locationInfo.storyMapLink : ''
                        });
                    }
                }
            }
            return parsedData;
        }

        const treeData = parseSpeciesLibraryCSV(speciesLibraryMappingCSV);

        const speciesSelectDropdown = document.getElementById('species-select');
        const locationSelectDropdown = document.getElementById('location-select');
        const resultsDiv = document.getElementById('results');
        const refreshButton = document.getElementById('refresh-button');
        const resultsArrow = document.getElementById('results-arrow');

        function populateSpeciesDropdown() {
            const uniqueSpeciesInfo = [];
            const seenCombinations = new Set();

            treeData.forEach(item => {
                const combinationKey = `${item.commonName}|${item.spanishName}|${item.latinName}`;
                if (!seenCombinations.has(combinationKey)) {
                    uniqueSpeciesInfo.push({
                        common: item.commonName,
                        spanish: item.spanishName,
                        latin: item.latinName
                    });
                    seenCombinations.add(combinationKey);
                }
            });

            uniqueSpeciesInfo.sort((a, b) => a.common.localeCompare(b.common));
            speciesSelectDropdown.innerHTML = '<option value="">-- select here / selección aquí --</option>';
            uniqueSpeciesInfo.forEach(species => {
                const option = document.createElement('option');
                option.value = species.common;
                option.innerHTML = `${species.common} / ${species.spanish} / <i>${species.latin}</i>`;
                speciesSelectDropdown.appendChild(option);
            });
        }

        function populateLocationDropdown() {
            const uniqueLocations = [];
            const seenLocations = new Set();

            treeData.forEach(item => {
                if (!seenLocations.has(item.location)) {
                    uniqueLocations.push({
                        name: item.location,
                        address: item.address
                    });
                    seenLocations.add(item.location);
                }
            });

            uniqueLocations.sort((a, b) => a.name.localeCompare(b.name));
            locationSelectDropdown.innerHTML = '<option value="">-- select here / selección aquí --</option>';
            uniqueLocations.forEach(loc => {
                const option = document.createElement('option');
                option.value = loc.name;
                option.textContent = `${loc.name} (${loc.address})`;
                locationSelectDropdown.appendChild(option);
            });
        }

        function displayTreeSpeciesResults(selectedSpecies) {
            if (!selectedSpecies) {
                resultsDiv.innerHTML = '<p class="text-gray-600 text-center">Results will appear here.</p>';
                resultsArrow.classList.add('hidden');
                return;
            }

            const matchedEntries = treeData.filter(item => item.commonName === selectedSpecies);
            if (matchedEntries.length === 0) {
                resultsDiv.innerHTML = `<p class="text-red-600 text-center">No results found for "${selectedSpecies}".</p>`;
                resultsArrow.classList.add('hidden');
                return;
            }

            const first = matchedEntries[0];
            let resultsHtml = `<h2 class="text-base font-normal mb-3 text-gray-800">"${first.commonName} / ${first.spanishName} / <i>${first.latinName}</i>" is found at:</h2>`;
            resultsHtml += '<ul class="list-disc pl-5 space-y-2 text-sm text-gray-700">';
            
            matchedEntries.forEach(entry => {
                resultsHtml += '<li>';
                if (entry.storyMapLink) {
                    resultsHtml += `<a href="${entry.storyMapLink}" target="_blank" class="text-blue-600 hover:underline font-normal">${entry.location}</a>`;
                } else {
                    resultsHtml += `<span class="font-normal text-gray-900">${entry.location}</span>`;
                }
                resultsHtml += ` — <span class="text-gray-500">${entry.address}</span></li>`;
            });
            resultsHtml += '</ul>';

            resultsDiv.innerHTML = resultsHtml;
            resultsArrow.classList.remove('hidden');
        }

        function displayTreeSpeciesByLocation(selectedLocation) {
            if (!selectedLocation) {
                resultsDiv.innerHTML = '<p class="text-gray-600 text-center">Results will appear here.</p>';
                resultsArrow.classList.add('hidden');
                return;
            }

            const matchedEntries = treeData.filter(item => item.location === selectedLocation);
            if (matchedEntries.length === 0) {
                resultsDiv.innerHTML = `<p class="text-red-600 text-center">No species data noted for this location.</p>`;
                resultsArrow.classList.add('hidden');
                return;
            }

            let resultaHtml = `<h2 class="text-base font-normal mb-3 text-gray-800">Species observed at ${selectedLocation}:</h2>`;
            resultaHtml += '<ul class="list-disc pl-5 space-y-1 text-sm text-gray-700">';
            
            matchedEntries.sort((a,b) => a.commonName.localeCompare(b.commonName)).forEach(entry => {
                resultaHtml += `<li><span class="font-normal text-gray-900">${entry.commonName}</span> / ${entry.spanishName} / <i>${entry.latinName}</i></li>`;
            });
            resultaHtml += '</ul>';

            resultsDiv.innerHTML = resultaHtml;
            resultsArrow.classList.remove('hidden');
        }

        speciesSelectDropdown.addEventListener('change', (event) => {
            locationSelectDropdown.value = '';
            displayTreeSpeciesResults(event.target.value);
        });

        locationSelectDropdown.addEventListener('change', (event) => {
            speciesSelectDropdown.value = '';
            displayTreeSpeciesByLocation(event.target.value);
        });

        refreshButton.addEventListener('click', () => {
            speciesSelectDropdown.value = '';
            locationSelectDropdown.value = '';
            resultsDiv.innerHTML = '<p class="text-gray-600 text-center">Results will appear here.</p>';
            resultsArrow.classList.add('hidden');
            speciesSelectDropdown.focus();
        });

        document.addEventListener('DOMContentLoaded', () => {
            populateSpeciesDropdown();
            populateLocationDropdown();
        });
    </script>
